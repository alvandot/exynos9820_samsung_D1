name: Kernel All Build (Ramdisk) 

on:
  workflow_dispatch:
    inputs:
      KERNELPATCH_ENABLED:
        description: 'Enable KernelPatch for root (recommended for Non-GKI)'
        required: false
        type: boolean
        default: false
      KERNELPATCH_VARIANT:
        description: 'KernelPatch variant'
        required: false
        type: choice
        default: 'sukisu'
        options:
          - sukisu
          - original

jobs:
  build:
    strategy:
      fail-fast: false 
      matrix:
        model:
          - G970F
          - G970N
          - G973F
          - G973N
          - G975F
          - G975N
          - G977B
          - G977N
          - N970F
          - N971N
          - N975F
          - N976B
          - N976N    

    runs-on: ubuntu-latest 

    steps:
    - name: 1. import kernel source
      uses: actions/checkout@v4     
      
    - name: 2. install package
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git libssl-dev bc flex bison \
          libncurses5-dev libncurses-dev cpio zip unzip \
          python3 curl rsync kmod libelf-dev \
          lz4 tar openssl python3-pip \
          gcc clang
        wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb && sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb   

    - name: 3. setting permission
      run: chmod +x build.sh

    - name: 4. kernel build
      run: |
        echo "Starting build for ${{ matrix.model }}_Kernel File"
        
        # KernelPatch (image-level patching - recommended for Non-GKI)
        if [ "${{ github.event.inputs.KERNELPATCH_ENABLED }}" = "true" ]; then
          export KERNELPATCH_ENABLED=1
          export KERNELPATCH_VARIANT="${{ github.event.inputs.KERNELPATCH_VARIANT }}"
          echo "KernelPatch integration is enabled (variant: $KERNELPATCH_VARIANT)"
        fi
        
        ./build.sh "${{ matrix.model }}"
        
    - name: 5. Upload Artifacts Kernel File
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.model }}_Ramdisk
        path: |
          gorhanhee/*.zip  
          gorhanhee/*.tar   
